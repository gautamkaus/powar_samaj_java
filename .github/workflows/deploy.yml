name: Deploy Powar Samaj Java Microservice to AWS EC2 (Free Tier)

# Trigger workflow on push to main branch
on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

# Environment variables
env:
  AWS_REGION: us-east-1  # Free tier region
  DOCKER_IMAGE: powar-samaj-java
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  # Build and Push Docker Image to Docker Hub
  build-and-push:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:latest

  # Deploy to EC2 (Free Tier Optimized)
  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
