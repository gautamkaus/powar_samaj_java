server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: powar-java-backend
  
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=false&serverTimezone=UTC&zeroDateTimeBehavior=convertToNull&allowPublicKeyRetrieval=true&useLegacyDatetimeCode=false&useUnicode=true&characterEncoding=utf8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC
        connection:
          characterEncoding: utf8
          useUnicode: true
        # Force Hibernate to use exact table names as specified in @Table annotations
        globally_quoted_identifiers: true
        globally_quoted_identifiers_skip_column_definitions: true
        # Use physical naming strategy to respect @Table annotations
        naming:
          physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        hbm2ddl:
          auto: none
    database-platform: org.hibernate.dialect.MySQLDialect

# Python API Configuration
python:
  api:
    base-url: ${PYTHON_API_URL:http://localhost:5000}
    endpoints:
      members: /api/python/members
      blogs: /api/python/blogs
      communities: /api/python/communities
      analytics: /api/python/analytics

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds

# Logging
logging:
  level:
    com.powar: ${LOGGING_LEVEL:INFO}
    org.springframework.security: ${LOGGING_LEVEL:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

