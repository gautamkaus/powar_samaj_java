  datasource:
    url: jdbc:mysql://yugenixdb.c1uoq02kudcw.ap-south-1.rds.amazonaws.com:3306/yugenixdb?useSSL=false&serverTimezone=UTC&zeroDateTimeBehavior=convertToNull&allowPublicKeyRetrieval=true&useLegacyDatetimeCode=false&useUnicode=true&characterEncoding=utf8
    username: admin
    password: JAIe0zcenyBbGWisbAQf
    driver-class-name: com.mysql.cj.jdbc.Driver

  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
        connection:
          characterEncoding: utf8
          useUnicode: true
        # Force Hibernate to use exact table names as specified in @Table annotations
        globally_quoted_identifiers: true
        globally_quoted_identifiers_skip_column_definitions: true
        # Use physical naming strategy to respect @Table annotations
        naming:
          physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        hbm2ddl:
          auto: none
    database-platform: org.hibernate.dialect.MySQLDialect

